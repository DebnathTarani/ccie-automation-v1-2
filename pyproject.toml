[project]
name = "ccie-automation-v1-2"
version = "0.1.0"
description = "CCIE Automation Practical v1.2"
readme = "README.md"
authors = [
    { name = "Tarani Debnath", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks]>=4.0.10",
    "scrapli[asyncssh,textfsm]>=2026.2.20",
    "ssh2-python>=1.2.0.post1",
]

[project.scripts]
ccie-automation-v1-2 = "ccie_automation_v1_2:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
